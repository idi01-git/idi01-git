name: Refresh profile stats and activity

on:
  push:
    paths:
      - 'README.md'
      - 'scripts/update-github-activity.mjs'
      - '.github/workflows/update-cp-stats.yml'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public ratings and rebuild SVG
        run: node scripts/update-cp-stats.mjs
      - name: Fetch GitHub contributions and rebuild charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-activity.mjs
      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/competitive-programming-live.svg assets/github-contribution-heatmap.svg assets/github-activity-graph.svg data/competitive-programming-stats.json data/github-contributions.json
          if git diff --cached --quiet; then
            echo "No stats changed."
          else
            git commit -m "chore: refresh competitive programming stats"
            git push
          fi
