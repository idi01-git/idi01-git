<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="28" viewBox="0 0 1774 28" role="img" aria-label="Berserk themed crimson glowing full-width divider">
  <defs>
    <!-- High-intensity crimson blur filter -->
    <filter id="crimson-glow-strong" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="center-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ff2238" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#e51d2b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e51d2b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-width deep ambient crimson glow (spans entire 1774 width) -->
  <line x1="0" y1="14" x2="1774" y2="14" stroke="#e51d2b" stroke-width="12" stroke-opacity="0.4" filter="url(#crimson-glow-strong)"/>

  <!-- Full-width focused scarlet beam (spans entire 1774 width) -->
  <line x1="0" y1="14" x2="1774" y2="14" stroke="#ff2238" stroke-width="6" stroke-opacity="0.8" filter="url(#crimson-glow-strong)"/>

  <!-- Full-width solid razor crimson core -->
  <line x1="0" y1="14" x2="1774" y2="14" stroke="#ff1e38" stroke-width="3" stroke-opacity="1"/>

  <!-- Full-width bright scarlet hot filament -->
  <line x1="0" y1="14" x2="1774" y2="14" stroke="#ff5967" stroke-width="1.6"/>

  <!-- White-hot laser filament across center span -->
  <line x1="300" y1="14" x2="1474" y2="14" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.85"/>

  <!-- Left Side Design: Berserk Manga Panel Brackets & Hard Edge End Cap -->
  <polygon points="0,3 12,3 12,25 0,25" fill="#e51d2b"/>
  <line x1="0" y1="3" x2="150" y2="3" stroke="#ff3345" stroke-width="1.2" opacity="0.85"/>
  <line x1="0" y1="25" x2="150" y2="25" stroke="#ff3345" stroke-width="1.2" opacity="0.85"/>
  <path d="M0 3L36 3L50 14L36 25L0 25" fill="none" stroke="#ff2238" stroke-width="2" filter="url(#crimson-glow-strong)"/>
  <path d="M0 7L24 7L32 14L24 21L0 21" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <polygon points="70,6 78,14 70,22 62,14" fill="#ffffff" filter="url(#crimson-glow-strong)"/>
  <polygon points="70,8.5 75.5,14 70,19.5 64.5,14" fill="#ff2238"/>
  <polygon points="102,9 107,14 102,19 97,14" fill="#ff3345" filter="url(#crimson-glow-strong)"/>
  <line x1="18" y1="2" x2="28" y2="26" stroke="#ff3345" stroke-width="1.2" opacity="0.85"/>
  <line x1="28" y1="2" x2="38" y2="26" stroke="#ff3345" stroke-width="1" opacity="0.7"/>
  <line x1="38" y1="2" x2="48" y2="26" stroke="#ff3345" stroke-width="0.8" opacity="0.5"/>

  <!-- Right Side Design: Berserk Manga Panel Brackets & Hard Edge End Cap -->
  <polygon points="1774,3 1762,3 1762,25 1774,25" fill="#e51d2b"/>
  <line x1="1624" y1="3" x2="1774" y2="3" stroke="#ff3345" stroke-width="1.2" opacity="0.85"/>
  <line x1="1624" y1="25" x2="1774" y2="25" stroke="#ff3345" stroke-width="1.2" opacity="0.85"/>
  <path d="M1774 3L1738 3L1724 14L1738 25L1774 25" fill="none" stroke="#ff2238" stroke-width="2" filter="url(#crimson-glow-strong)"/>
  <path d="M1774 7L1750 7L1742 14L1750 21L1774 21" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <polygon points="1704,6 1712,14 1704,22 1696,14" fill="#ffffff" filter="url(#crimson-glow-strong)"/>
  <polygon points="1704,8.5 1709.5,14 1704,19.5 1698.5,14" fill="#ff2238"/>
  <polygon points="1672,9 1677,14 1672,19 1667,14" fill="#ff3345" filter="url(#crimson-glow-strong)"/>
  <line x1="1756" y1="2" x2="1746" y2="26" stroke="#ff3345" stroke-width="1.2" opacity="0.85"/>
  <line x1="1746" y1="2" x2="1736" y2="26" stroke="#ff3345" stroke-width="1" opacity="0.7"/>
  <line x1="1736" y1="2" x2="1726" y2="26" stroke="#ff3345" stroke-width="0.8" opacity="0.5"/>

  <!-- Center Berserk Sigil: Glowing Behelit/Brand Diamond Flare -->
  <circle cx="887" cy="14" r="14" fill="url(#center-flare)" filter="url(#crimson-glow-strong)"/>
  <polygon points="887,2 897,14 887,26 877,14" fill="#ffffff" filter="url(#crimson-glow-strong)"/>
  <polygon points="887,4.5 894.5,14 887,23.5 879.5,14" fill="#ff2238"/>
  <polygon points="887,8 892,14 887,20 882,14" fill="#ffffff"/>

  <!-- Left Accent Diamond -->
  <polygon points="835,8 841,14 835,20 829,14" fill="#ff3345" filter="url(#crimson-glow-strong)"/>
  <polygon points="835,10 839,14 835,18 831,14" fill="#ffffff"/>

  <!-- Right Accent Diamond -->
  <polygon points="939,8 945,14 939,20 933,14" fill="#ff3345" filter="url(#crimson-glow-strong)"/>
  <polygon points="939,10 943,14 939,18 935,14" fill="#ffffff"/>

  <!-- Dynamic Manga Slash Accents -->
  <line x1="720" y1="10" x2="845" y2="13" stroke="#ff3345" stroke-width="1.2" opacity="0.8"/>
  <line x1="929" y1="15" x2="1054" y2="18" stroke="#ff3345" stroke-width="1.2" opacity="0.8"/>
</svg>
