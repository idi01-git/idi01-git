<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="24" viewBox="0 0 1774 24" role="img" aria-label="Berserk themed crimson glowing manga panel divider">
  <defs>
    <!-- Core gradient: blazing white-crimson center fading to blood red and transparent ends -->
    <linearGradient id="beam-core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e51d2b" stop-opacity="0"/>
      <stop offset="15%" stop-color="#e51d2b" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#ff2238" stop-opacity="0.85"/>
      <stop offset="47%" stop-color="#ff5967" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="53%" stop-color="#ff5967" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ff2238" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#e51d2b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e51d2b" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep ambient crimson glow gradient -->
    <linearGradient id="beam-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e51d2b" stop-opacity="0"/>
      <stop offset="20%" stop-color="#e51d2b" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff1e38" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#e51d2b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e51d2b" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft outer glow filter -->
    <filter id="crimson-glow" x="-10%" y="-150%" width="120%" height="400%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="center-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#ff3345" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#e51d2b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e51d2b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep ambient glow layer -->
  <path d="M0 12H1774" stroke="url(#beam-glow)" stroke-width="7" opacity="0.6" filter="url(#crimson-glow)"/>

  <!-- Focused scarlet aura -->
  <path d="M80 12H1694" stroke="#ff2238" stroke-width="3.2" opacity="0.85" filter="url(#crimson-glow)"/>

  <!-- Razor sharp white-crimson core beam -->
  <path d="M0 12H1774" stroke="url(#beam-core)" stroke-width="1.6"/>

  <!-- Center Berserk Sigil: Glowing diamond ember with side sparks -->
  <!-- Center flare bloom -->
  <circle cx="887" cy="12" r="11" fill="url(#center-burst)" filter="url(#crimson-glow)"/>

  <!-- Center glowing diamond -->
  <polygon points="887,4 894,12 887,20 880,12" fill="#ffffff" filter="url(#crimson-glow)"/>
  <polygon points="887,5.5 892.5,12 887,18.5 881.5,12" fill="#ff2238"/>
  <polygon points="887,8 890,12 887,16 884,12" fill="#ffffff"/>

  <!-- Left accent diamond -->
  <polygon points="835,8 839,12 835,16 831,12" fill="#ff3345" filter="url(#crimson-glow)"/>
  <polygon points="835,9.5 837.5,12 835,14.5 832.5,12" fill="#ffffff"/>

  <!-- Right accent diamond -->
  <polygon points="939,8 943,12 939,16 935,12" fill="#ff3345" filter="url(#crimson-glow)"/>
  <polygon points="939,9.5 941.5,12 939,14.5 936.5,12" fill="#ffffff"/>

  <!-- Secondary manga slash lines -->
  <path d="M720 9L850 11" stroke="#ff3345" stroke-width="0.8" opacity="0.7"/>
  <path d="M924 13L1054 15" stroke="#ff3345" stroke-width="0.8" opacity="0.7"/>
</svg>
